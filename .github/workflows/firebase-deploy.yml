name: Deploy to Firebase

# Builds the web app and deploys Hosting + Firestore rules/indexes to Firebase.
#
# Cloud Functions deploy is deferred for now (Microsoft Graph mail config and
# the Blaze plan upgrade aren't set up yet — Spark doesn't allow outbound
# networking from functions). Re-add "functions" to --only below, and the
# functions install/.env steps, once that's ready.
#
# Required GitHub secrets (Settings > Secrets and variables > Actions):
#   FIREBASE_SERVICE_ACCOUNT   JSON key for a service account with the
#                              "Firebase Admin" + "Cloud Functions Admin" +
#                              "Service Account User" roles.
#   FIREBASE_PROJECT_ID        e.g. binary-crm-186b5
#   VITE_FIREBASE_API_KEY
#   VITE_FIREBASE_AUTH_DOMAIN
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_STORAGE_BUCKET
#   VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID
#
# Deferred until functions are re-enabled:
#   GRAPH_TENANT_ID, GRAPH_CLIENT_ID, MAIL_SENDER, MAIL_RECIPIENTS
#   GRAPH_CLIENT_SECRET (Cloud Secret Manager, set via CLI — see README.md)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install web dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"

      - name: Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npx firebase-tools@13 deploy \
            --only hosting,firestore \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --non-interactive \
            --force
