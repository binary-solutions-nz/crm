name: Deploy to Firebase

# Builds the web app + Cloud Functions and deploys Hosting, Functions and
# Firestore rules/indexes to Firebase.
#
# Required GitHub secrets (Settings > Secrets and variables > Actions):
#   FIREBASE_SERVICE_ACCOUNT   JSON key for a service account with the
#                              "Firebase Admin" + "Cloud Functions Admin" +
#                              "Service Account User" roles.
#   FIREBASE_PROJECT_ID        e.g. binary-solutions-crm
#   VITE_FIREBASE_API_KEY
#   VITE_FIREBASE_AUTH_DOMAIN
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_STORAGE_BUCKET
#   VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID
#   GRAPH_TENANT_ID
#   GRAPH_CLIENT_ID
#   MAIL_SENDER
#   MAIL_RECIPIENTS
#
# The GRAPH_CLIENT_SECRET is a Cloud Secret Manager secret, set once via the CLI
# (see README.md) — it is NOT provided through this workflow.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install web dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Install functions dependencies
        run: npm --prefix functions install

      - name: Write Cloud Functions params (.env)
        run: |
          cat > functions/.env <<EOF
          GRAPH_TENANT_ID=${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID=${{ secrets.GRAPH_CLIENT_ID }}
          MAIL_SENDER=${{ secrets.MAIL_SENDER }}
          MAIL_RECIPIENTS=${{ secrets.MAIL_RECIPIENTS }}
          REMINDER_WINDOW_DAYS=30
          INCLUDE_WARRANTIES=true
          EOF

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"

      - name: Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npx firebase-tools@13 deploy \
            --only hosting,functions,firestore \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --non-interactive \
            --force
